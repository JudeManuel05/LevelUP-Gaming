<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>LevelUp Gaming - Ingresar</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container">
                    <a class="navbar-brand" href="index.html"><img src="logo.svg" alt="Logo LevelUp Gaming" class="logo">Level<span class="text-success">Up</span> Gaming</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="menuPrincipal">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                            <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                            <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
                            <li class="nav-item"><a class="nav-link active" href="login.html">Ingresar</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container mt-5 mb-5">
            <h1 class="text-center mb-4">Mi cuenta</h1>

            <div class="row g-5">

                <!-- 1. Crear usuario -->
                <section class="col-lg-6">
                    <div class="formulario">
                        <h2 class="mb-3">1. Crear usuario</h2>

                        <form id="formCrear" novalidate>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Pérez" autocomplete="name">
                                <small class="text-muted">Mínimo 3 letras.</small>
                                <p class="error" id="errorNombre"></p>
                            </div>

                            <div class="mb-3">
                                <label for="rut" class="form-label">RUT</label>
                                <input type="text" id="rut" class="form-control" placeholder="Ej: 12345678-9">
                                <small class="text-muted">Sin puntos y con guion.</small>
                                <p class="error" id="errorRut"></p>
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" id="telefono" class="form-control" placeholder="Ej: 912345678" autocomplete="tel">
                                <small class="text-muted">9 números.</small>
                                <p class="error" id="errorTelefono"></p>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" id="correo" class="form-control" placeholder="Ej: juan@gmail.com" autocomplete="email">
                                <p class="error" id="errorCorreo"></p>
                            </div>

                            <div class="mb-3">
                                <label for="clave" class="form-label">Contraseña</label>
                                <input type="password" id="clave" class="form-control" autocomplete="new-password">
                                <small class="text-muted">Mínimo 6 caracteres.</small>
                                <p class="error" id="errorClave"></p>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Crear usuario</button>
                            <p class="text-success fw-bold mt-3" id="mensajeCrear"></p>
                        </form>
                    </div>
                </section>

                <!-- 2. Ingresar usuario -->
                <section class="col-lg-6">
                    <div class="formulario">
                        <h2 class="mb-3">2. Ingresar usuario</h2>

                        <form id="formIngresar" novalidate>
                            <div class="mb-3">
                                <label for="correoIngreso" class="form-label">Correo</label>
                                <input type="email" id="correoIngreso" class="form-control" placeholder="Ej: juan@gmail.com" autocomplete="email">
                                <p class="error" id="errorCorreoIngreso"></p>
                            </div>

                            <div class="mb-3">
                                <label for="claveIngreso" class="form-label">Contraseña</label>
                                <input type="password" id="claveIngreso" class="form-control" autocomplete="current-password">
                                <p class="error" id="errorClaveIngreso"></p>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Ingresar</button>
                            <p class="error mt-3" id="errorIngreso"></p>
                            <p class="text-success fw-bold mt-3" id="mensajeIngreso"></p>
                        </form>
                    </div>
                </section>

            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
